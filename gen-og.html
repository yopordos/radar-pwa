<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; padding: 40px; gap: 20px; font-family: 'Poppins', sans-serif; }
  canvas { max-width: 100%; border-radius: 8px; box-shadow: 0 24px 64px rgba(0,0,0,0.7); }
  button { background: #e8ff47; color: #000; border: none; padding: 14px 32px; font-size: 15px; cursor: pointer; font-weight: bold; border-radius: 8px; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<button onclick="download()">Descargar og-image.png</button>
<img id="logo" src="./logo.png" style="display:none" crossorigin="anonymous">

<script>
const logoImg = document.getElementById('logo');

function start() {
  Promise.all([
    document.fonts.load("900 16px 'Poppins'"),
    document.fonts.load("700 16px 'Poppins'"),
    document.fonts.load("300 16px 'Poppins'"),
    new Promise(res => {
      if (logoImg.complete && logoImg.naturalWidth > 0) res();
      else { logoImg.onload = res; logoImg.onerror = () => res(); }
    })
  ]).then(draw);
}
start();

function draw() {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const W = 1200, H = 630;
  const YEL = '#e8ff47';

  // ── Fondo ──
  ctx.fillStyle = '#0c0c0c';
  ctx.fillRect(0, 0, W, H);

  // ── Centro del radar (izquierda) ──
  const cx = 310, cy = H / 2;
  const rings = [118, 208, 298];

  // Glow difuso detrás del radar
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 380);
  bg.addColorStop(0, 'rgba(232,255,71,0.09)');
  bg.addColorStop(0.5, 'rgba(232,255,71,0.03)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // ── Anillos del radar ──
  rings.forEach((r, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(232,255,71,${0.20 - i * 0.05})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // ── Ejes cruzados (muy sutiles) ──
  ctx.strokeStyle = 'rgba(232,255,71,0.05)';
  ctx.lineWidth = 1;
  [[cx - 310, cy, cx + 310, cy], [cx, cy - 310, cx, cy + 310]].forEach(([x1, y1, x2, y2]) => {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });

  // ── Puntos (personas en el radar) ──
  const dotSize = 5;
  const dots = [
    { a: -38,  ri: 1 },
    { a:  72,  ri: 0 },
    { a: 148,  ri: 2 },
    { a: -115, ri: 1 },
    { a: 205,  ri: 2 },
    { a: 268,  ri: 0 },
  ];
  // Calcular posiciones
  const dotPos = dots.map(({ a, ri }) => ({
    x: cx + rings[ri] * Math.cos(a * Math.PI / 180),
    y: cy + rings[ri] * Math.sin(a * Math.PI / 180),
  }));

  // Una sola línea de conexión (par 0 y 3)
  ctx.beginPath();
  ctx.moveTo(dotPos[0].x, dotPos[0].y);
  ctx.lineTo(dotPos[3].x, dotPos[3].y);
  ctx.strokeStyle = 'rgba(232,255,71,0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Ondas pequeñas en todos los puntos
  dotPos.forEach(({ x, y }) => {
    [14, 24].forEach((r, i) => {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(232,255,71,${0.12 - i * 0.05})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  });

  // Puntos
  dotPos.forEach(({ x, y }) => {
    ctx.beginPath();
    ctx.arc(x, y, dotSize, 0, Math.PI * 2);
    ctx.fillStyle = YEL;
    ctx.fill();
  });

  // ── Logo centrado en el radar (recortado circular) ──
  const logoSize = 264;
  if (logoImg.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, logoSize / 2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(logoImg, cx - logoSize / 2, cy - logoSize / 2, logoSize, logoSize);
    ctx.restore();
  }

  // ── TEXTO (columna derecha) ──
  const txtX = 630;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  const sz  = 64;
  const lh  = 76;
  const sz2 = 38;
  const lh2 = 50;
  // Bloque total: 2 líneas grandes + 2 líneas medianas + url
  const blockH = lh * 2 + 18 + lh2 * 2 + 40;
  const y1 = cy - blockH / 2 + sz;

  // Bloque 1 — bold grande
  ctx.font = `900 ${sz}px 'Poppins', sans-serif`;
  ctx.fillStyle = '#f5f0e8';
  ctx.fillText('la música que', txtX, y1);

  // "te gusta," blanco + "o no." amarillo en misma línea
  ctx.fillText('te gusta, ', txtX, y1 + lh);
  const w1 = ctx.measureText('te gusta, ').width;
  ctx.fillStyle = YEL;
  ctx.fillText('o no.', txtX + w1, y1 + lh);

  // Bloque 2 — light mediano
  ctx.font = `300 ${sz2}px 'Poppins', sans-serif`;
  ctx.fillStyle = 'rgba(245,240,232,0.6)';
  const y2 = y1 + lh + 28;
  ctx.fillText('cerca de ti', txtX, y2 + lh2);
  ctx.fillText('en tiempo real', txtX, y2 + lh2 * 2);

  // URL
  ctx.font = `700 20px 'Poppins', sans-serif`;
  ctx.fillStyle = YEL;
  ctx.fillText('radarpin.me', txtX, y2 + lh2 * 2 + 44);

}

function download() {
  const a = document.createElement('a');
  a.download = 'og-image.png';
  a.href = document.getElementById('c').toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
