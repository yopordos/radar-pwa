<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
<style>
  body { background: #111; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 40px; font-family: 'Poppins', sans-serif; }
  canvas { border-radius: 8px; }
  a { color: #e8ff47; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>

<script>
function draw(id, size) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const cx = size / 2;
  const r  = size * 0.44;

  // Fondo negro
  ctx.fillStyle = '#0c0c0c';
  ctx.fillRect(0, 0, size, size);

  // Círculo amarillo plano
  ctx.beginPath();
  ctx.arc(cx, cx, r, 0, Math.PI * 2);
  ctx.fillStyle = '#e8ff47';
  ctx.fill();

  // Texto RAdAR flat
  const fs = size * 0.22;
  ctx.font = `900 ${fs}px 'Poppins', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#0c0c0c';
  ctx.fillText('RAdAR', cx, cx + fs * 0.05);

  const link = document.createElement('a');
  link.download = `icon-${size}.png`;
  link.href = c.toDataURL();
  link.textContent = `Descargar icon-${size}.png`;
  link.style.display = 'block';
  document.body.appendChild(link);
}

Promise.all([
  document.fonts.load("900 16px 'Poppins'"),
]).then(() => {
  draw('c192', 192);
  draw('c512', 512);
});
</script>
</body>
</html>
