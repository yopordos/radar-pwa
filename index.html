  <!-- ── JSON-LD Structured Data ── -->
  <script type="application/ld+json">

    "@context": "https://schema.org",

    "applicationCategory": "MusicApplication",
    "operatingSystem": "Web, iOS, Android",

    },
    "featureList": [
      "Detección de música en tiempo real vía Spotify",

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* [2] Fondo con gradiente radial sutil */
    html, body {
      height: 100%;
      background: radial-gradient(ellipse at 50% 35%, #141416 0%, #0c0c0c 65%);
      overscroll-behavior: none;
    }

    body {
      color: #f5f0e8;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    button {
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      border: none;
      -webkit-appearance: none;
    }

    /* ═══════════════════════════════════════════
       MOBILE — single column, app-like
    ═══════════════════════════════════════════ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      transition: height 0.05s;
      /* Las ondas quedan detrás del app */
      position: relative;
      z-index: 1;
    }

    .screen {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 28px 20px 20px;
      overflow: hidden;
    }

    /* Mobile header */
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      margin-top: 10px;
      flex-shrink: 0;
    }
    .header-titles { flex: 1; }
    .big-title      { font-weight: 900; font-size: 34px; color: #e8ff47; letter-spacing: -1px; line-height: 36px; margin-bottom: 2px; }
    .big-title-gray { font-weight: 900; font-size: 34px; color: #333;   letter-spacing: -1px; line-height: 36px; }

    /* Bottom bar (mobile only) */
    .bottom-bar {
      display: flex; align-items: center; gap: 10px;
      height: 68px; flex-shrink: 0; padding-top: 8px;
    }
    .bottom-song {
      flex: 1; background: #e8ff47; border-radius: 14px;
      padding: 12px 14px; min-height: 68px;
      border: none; text-align: left;
      display: flex; flex-direction: column; justify-content: center;
      overflow: hidden; cursor: pointer;
      transition: opacity 0.15s;
    }
    .bottom-song:active { opacity: 0.85; }
    .bottom-label       { color: rgba(0,0,0,0.45); font-size: 8px; font-weight: 700; letter-spacing: 2px; margin-bottom: 1px; }
    .bottom-song-row    { display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .bottom-song-title  { color: #0c0c0c; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .bottom-artist      { color: rgba(0,0,0,0.5); font-size: 12px; font-style: italic; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .inbox-btn {
      width: 54px; height: 54px; display: flex; align-items: center;
      justify-content: center; position: relative;
      background: transparent; flex-shrink: 0;
    }
    .inbox-dot {
      width: 24px; height: 24px; border-radius: 50%;
      background: #2a2a2a; display: flex; align-items: center;
      justify-content: center; font-size: 12px; font-weight: 900;
      color: #444; position: relative; z-index: 2; transition: background 0.2s, color 0.2s;
    }
    .inbox-dot.has-activity { background: #e8ff47; color: #0c0c0c; }
    .inbox-ring {
      position: absolute; width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid #e8ff47;
      animation: inbox-pulse 1.5s ease-out infinite; pointer-events: none;
    }
    @keyframes inbox-pulse {
      0%   { transform: scale(1);   opacity: 0.85; }
      100% { transform: scale(3.2); opacity: 0; }
    }

    /* Back / section title */
    .back-btn {
      background: transparent; color: #e8ff47;
      font-size: 12px; font-weight: 700; letter-spacing: 2px;
      margin-bottom: 16px; padding: 0; display: block; flex-shrink: 0;
    }
    .section-title {
      font-size: 28px; color: #f5f0e8; letter-spacing: 2px;
      margin-bottom: 16px; font-weight: 900; flex-shrink: 0;
    }

    /* ═══════════════════════════════════════════
       TABLET — single column, wider
    ═══════════════════════════════════════════ */
    @media (min-width: 768px) and (max-width: 1023px) {
      #app {
        max-width: 680px;
      }
      .screen { padding: 36px 32px 24px; }
      .big-title      { font-size: 42px; line-height: 44px; }
      .big-title-gray { font-size: 42px; line-height: 44px; }
      .radar-wrap     { width: 120px; height: 120px; }
      .radar-circle-btn { width: 100px; height: 100px; }
      .radar-label    { font-size: 22px; }
      .song-name      { font-size: 19px; }
      .bottom-song    { border-radius: 16px; }
    }

    /* ═══════════════════════════════════════════
       DESKTOP — two-column layout
    ═══════════════════════════════════════════ */
    @media (min-width: 1024px) {
      #app {
        max-width: none;
        width: 100%;
        display: grid;
        grid-template-rows: 68px 1fr;
        grid-template-columns: minmax(0, 1fr) 360px;
        grid-template-areas:
          "topbar topbar"
          "feed   side";
        height: 100vh;
      }

      /* Hide mobile-only elements on desktop */
      .mobile-only { display: none !important; }

      /* ── Top bar ── */
      .desktop-topbar {
        grid-area: topbar;
        display: flex;
        align-items: center;
        padding: 0 32px;
        border-bottom: 1px solid #1a1a1a;
        gap: 24px;
        flex-shrink: 0;
        background: #0c0c0c;
        position: relative; z-index: 2;
      }

      .topbar-logo {
        display: flex;
        align-items: baseline;
        gap: 0;
        flex-shrink: 0;
      }
      .topbar-logo-text  { font-weight: 900; font-size: 22px; color: #e8ff47; letter-spacing: -0.5px; }
      .topbar-logo-d     { font-weight: 900; font-style: italic; font-size: 22px; color: #e8ff47; }

      .topbar-divider {
        width: 1px; height: 28px; background: #222; flex-shrink: 0;
      }

      .topbar-now-playing {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .topbar-np-label {
        color: #444; font-size: 9px; font-weight: 700;
        letter-spacing: 2px; white-space: nowrap; flex-shrink: 0;
      }
      .topbar-np-song {
        color: #f5f0e8; font-size: 14px; font-weight: 700;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .topbar-np-artist {
        color: #555; font-size: 13px; font-style: italic;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        flex-shrink: 0;
      }
      .topbar-np-nothing {
        color: #333; font-size: 13px; font-style: italic;
      }

      .topbar-radar-btn {
        width: 44px; height: 44px; border-radius: 50%;
        background: #e8ff47; display: flex; align-items: center;
        justify-content: center; flex-shrink: 0;
        font-weight: 900; font-size: 10px; color: #0c0c0c;
        letter-spacing: 0; transition: opacity 0.15s, transform 0.1s;
        position: relative;
        /* [4] Glow en el radar btn del topbar */
        box-shadow: 0 0 20px rgba(232,255,71,0.2), 0 0 40px rgba(232,255,71,0.06);
      }
      .topbar-radar-btn:active { opacity: 0.7; transform: scale(0.95); }
      .topbar-radar-label { font-weight: 900; font-size: 10px; color: #0c0c0c; line-height: 1; }
      .topbar-radar-d { font-style: italic; }

      .topbar-inbox-btn {
        position: relative; width: 40px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        background: transparent; flex-shrink: 0;
        border-radius: 8px; transition: background 0.15s;
      }
      .topbar-inbox-btn:hover { background: #1a1a1a; }
      .topbar-inbox-btn.active .topbar-inbox-dot { background: #e8ff47; }

      .topbar-inbox-dot {
        width: 22px; height: 22px; border-radius: 50%;
        background: #2a2a2a; display: flex; align-items: center;
        justify-content: center; font-size: 11px; font-weight: 900;
        color: #444; position: relative; z-index: 2; transition: background 0.2s, color 0.2s;
      }
      .topbar-inbox-dot.has-activity { background: #e8ff47; color: #0c0c0c; }
      .topbar-inbox-ring {
        position: absolute; width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid #e8ff47;
        animation: inbox-pulse 1.5s ease-out infinite; pointer-events: none;
      }

      /* ── Feed panel ── */
      .desktop-feed {
        grid-area: feed;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
        padding: 32px 32px 24px;
        border-right: 1px solid #1a1a1a;
      }

      .desktop-feed-header {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
        flex-shrink: 0;
      }

      .desktop-feed-titles { flex: 1; }
      .desktop-big         { font-weight: 900; font-size: 42px; color: #e8ff47; letter-spacing: -1px; line-height: 44px; margin-bottom: 2px; }
      .desktop-big-gray    { font-weight: 900; font-size: 42px; color: #2a2a2a; letter-spacing: -1px; line-height: 44px; }

      /* ── Side panel — fondo opaco para bloquear ondas ── */
      .desktop-side {
        grid-area: side;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #0c0c0c;
        position: relative; z-index: 2;
      }

      .side-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 32px 28px 24px;
        overflow: hidden;
      }

      .side-title {
        font-size: 11px; font-weight: 700; letter-spacing: 3px;
        color: #444; margin-bottom: 20px; flex-shrink: 0;
        text-transform: uppercase;
      }

      /* Override screen/header for desktop */
      .screen { padding: 0; }
      .header { display: none; }
      .bottom-bar { display: none !important; }
    }

    /* ═══════════════════════════════════════════
       SHARED COMPONENTS
    ═══════════════════════════════════════════ */

    /* ── Overlay de ondas — posición fija, detrás de todo el contenido ── */
    #radar-ripple {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ripple-ring {
      position: absolute;
      border-radius: 50%;
      border: 0.5px solid rgba(232,255,71,0.28);
      animation: ripple-expand 5s cubic-bezier(0.2, 0, 0.6, 1) 1 forwards;
    }
    .ripple-ring:nth-child(2) { animation-delay: 0.6s; border-color: rgba(232,255,71,0.16); }
    .ripple-ring:nth-child(3) { animation-delay: 1.2s; border-color: rgba(232,255,71,0.08); }
    @keyframes ripple-expand {
      0%   { transform: scale(0.1); opacity: 0.6; }
      15%  { opacity: 0.4; }
      100% { transform: scale(60);  opacity: 0; }
    }

    /* Radar */
    .radar-wrap {
      width: 110px; height: 110px; display: flex;
      align-items: center; justify-content: center;
      position: relative; flex-shrink: 0;
    }
    .radar-circle-btn {
      width: 90px; height: 90px; border-radius: 50%;
      background: #e8ff47; display: flex; align-items: center;
      justify-content: center; cursor: pointer; position: relative;
      z-index: 2; border: none; transition: transform 0.1s, opacity 0.1s;
      box-shadow: 0 0 32px rgba(232,255,71,0.22), 0 0 64px rgba(232,255,71,0.07);
    }
    .radar-circle-btn:active { transform: scale(0.95); opacity: 0.8; }
    .radar-label { font-size: 19px; color: #0c0c0c; line-height: 22px; user-select: none; font-weight: 900; }
    .radar-d     { font-style: italic; }

    /* Scroll area */
    .scroll-area {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; margin-top: 12px;
    }

    /* [3] Cards con profundidad, hover y acento izquierdo en chat activo */
    .card {
      background: #1a1a1a; border-radius: 12px; padding: 14px;
      margin-bottom: 10px; display: flex; align-items: center;
      gap: 8px; border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
    }
    .card:hover { background: #1e1e1e; }
    .card.has-chat {
      border-color: rgba(232,255,71,0.4);
      border-left: 3px solid #e8ff47;
      padding-left: 11px;
    }
    .card-info      { flex: 1; min-width: 0; }
    .song-name      { color: #f5f0e8; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist-name    { color: #777; font-size: 14px; font-style: italic; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* [9] Distancia con dot pulsante vía pseudo-elemento */
    .distance {
      color: #e8ff47; font-size: 11px; margin-top: 4px;
      font-weight: 700; letter-spacing: 1px;
      display: flex; align-items: center; gap: 5px;
    }
    .distance::before {
      content: '';
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #e8ff47;
      flex-shrink: 0;
      animation: dist-pulse 2s ease-in-out infinite;
    }
    @keyframes dist-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.4); }
    }

    .card-btns      { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .chat-active-dot { width: 10px; height: 10px; border-radius: 50%; background: #e8ff47; }

    .btn-listen { background: #1e1e1e; border: 1px solid #333; color: #e8ff47; font-size: 14px; padding: 8px 10px; border-radius: 8px; transition: border-color 0.15s; }
    .btn-listen:hover { border-color: #555; }
    .btn-chat   { background: #e8ff47; color: #0c0c0c; font-size: 10px; font-weight: 900; letter-spacing: 1px; padding: 8px 12px; border-radius: 8px; transition: opacity 0.15s; }
    .btn-chat:hover { opacity: 0.85; }

    /* Login buttons */
    .btn-login  { font-weight: 900; font-size: 15px; letter-spacing: 1px; padding: 18px; border-radius: 14px; width: 100%; transition: opacity 0.15s, transform 0.1s; }
    .btn-login:active { opacity: 0.85; transform: scale(0.98); }
    .btn-spotify { background: #1DB954; color: #fff; margin-bottom: 12px; }
    .btn-lastfm  { background: #d51007; color: #fff; }
    .login-buttons { flex: 1; display: flex; flex-direction: column; justify-content: center; }

    @media (min-width: 1024px) {
      .login-buttons { max-width: 400px; }
    }

    /* Section labels */
    .section-label  { color: #e8ff47; font-size: 9px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; flex-shrink: 0; }
    .signal-label   { color: #e8ff47; font-size: 9px; font-weight: 700; letter-spacing: 2px; margin-bottom: 3px; }

    /* Tap buttons */
    .btn-connect { background: #e8ff47; color: #0c0c0c; font-size: 10px; font-weight: 900; letter-spacing: 1px; padding: 8px 12px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; transition: opacity 0.15s; }
    .btn-connect:hover { opacity: 0.85; }
    .btn-ignore  { background: transparent; color: #555; font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 8px 4px; white-space: nowrap; flex-shrink: 0; transition: color 0.15s; }
    .btn-ignore:hover { color: #777; }
    .btn-close-chat { background: transparent; color: #e8ff47; font-size: 16px; font-weight: 700; padding: 4px 0 4px 12px; flex-shrink: 0; transition: opacity 0.15s; }
    .btn-close-chat:hover { opacity: 0.7; }

    .empty { color: #333; font-size: 15px; text-align: center; margin-top: 40px; font-style: italic; line-height: 26px; padding: 0 10px; display: block; }

    /* [7] Chat bubbles con mayor contraste y border-radius asimétrico */
    .chat-screen    { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .chat-header    { padding: 28px 20px 0; flex-shrink: 0; }
    .chat-anon      { color: #555; font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; text-align: center; }
    .chat-warning   { color: #333; font-size: 10px; text-align: center; margin-bottom: 8px; font-style: italic; padding: 0 16px; line-height: 1.4; }
    .messages-area  { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px; }
    .bubble         { max-width: 80%; padding: 10px 12px; margin-bottom: 8px; word-break: break-word; }
    .bubble-me      {
      background: rgba(232,255,71,0.18);
      border: 1px solid rgba(232,255,71,0.25);
      border-radius: 16px 16px 4px 16px;
      margin-left: auto;
    }
    .bubble-them    {
      background: #1a1a1a;
      border-radius: 16px 16px 16px 4px;
      margin-right: auto;
    }
    .bubble-text    { color: #f5f0e8; font-size: 13px; line-height: 1.5; }
    .input-row      { display: flex; gap: 8px; padding: 10px 16px 16px; border-top: 1px solid #1e1e1e; flex-shrink: 0; }
    .chat-input     { flex: 1; background: #1a1a1a; color: #f5f0e8; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-family: 'Poppins', sans-serif; outline: none; transition: background 0.15s; }
    .chat-input:focus { background: #1e1e1e; }
    .chat-input::placeholder { color: #444; }
    .send-btn       { background: #e8ff47; color: #0c0c0c; border: none; border-radius: 8px; padding: 0 16px; font-size: 16px; font-weight: 900; cursor: pointer; transition: opacity 0.15s; }
    .send-btn:hover { opacity: 0.85; }

    @media (min-width: 1024px) {
      .chat-header { padding: 0 0 16px; }
      .input-row   { padding: 10px 0 0; }
    }

    /* [10] Toast aparece arriba, fondo diferenciado */
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 16px);
      bottom: auto;
      left: 50%; transform: translateX(-50%);
      white-space: nowrap; background: #1e1e1e; border: 1px solid #e8ff47;
      padding: 10px 20px; border-radius: 10px; z-index: 200;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast-text { color: #e8ff47; font-size: 12px; font-weight: 700; letter-spacing: 1px; }

    /* Loading */
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(12,12,12,0.92);
      display: flex; align-items: center; justify-content: center; z-index: 300;
    }
    .loading-text { color: #e8ff47; font-size: 14px; font-weight: 700; letter-spacing: 3px; }

    /* Desktop side panel tabs */
    .side-tabs {
      display: flex; gap: 0; border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0; margin-bottom: 0;
    }
    .side-tab {
      flex: 1; padding: 14px 16px; font-size: 11px; font-weight: 700;
      letter-spacing: 2px; color: #444; background: transparent;
      border: none; cursor: pointer; transition: color 0.15s;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .side-tab.active { color: #e8ff47; border-bottom-color: #e8ff47; }
    .side-tab:hover:not(.active) { color: #777; }

    .side-tab-content { flex: 1; overflow-y: auto; padding: 20px 28px 24px; }

    /* ═══════════════════════════════════════════
       [5] ONBOARDING — radar sweep hero
    ═══════════════════════════════════════════ */
    .login-screen {
      padding: 0;
      justify-content: flex-start;
      overflow: hidden;
      position: relative;
    }

    /* Radar hero — ocupa el 60% superior */
    .onb-radar {
      position: relative;
      width: 100%;
      height: 58vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Anillos estáticos concéntricos */
    .onb-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(232,255,71,0.1);
      pointer-events: none;
    }
    .or1 { width: 80px;  height: 80px;  border-color: rgba(232,255,71,0.35); }
    .or2 { width: 155px; height: 155px; }
    .or3 { width: 240px; height: 240px; }
    .or4 { width: 340px; height: 340px; border-color: rgba(232,255,71,0.06); }
    .or5 { width: 460px; height: 460px; border-color: rgba(232,255,71,0.04); }

    /* Sweep eliminado — las ondas vienen del overlay #radar-ripple */

    /* Puntos de conexión distribuidos por todo el viewport (login) */
    .login-dot {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e8ff47;
      opacity: 0;
      animation: login-dot-show 5s ease-in-out infinite;
    }
    .login-dot::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(232,255,71,0.25);
      animation: login-dot-ring 5s ease-in-out infinite;
    }
    @keyframes login-dot-show {
      0%, 10%   { opacity: 0; transform: scale(0.4); }
      25%, 65%  { opacity: 1; transform: scale(1);   }
      90%, 100% { opacity: 0; transform: scale(0.6); }
    }
    @keyframes login-dot-ring {
      0%, 10%  { transform: scale(0.4); opacity: 0; }
      30%      { transform: scale(1);   opacity: 0.5; }
      90%      { transform: scale(4);   opacity: 0; }
    }

    /* Centro: botón RAdAR */
    .onb-center {
      position: relative; z-index: 3;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #e8ff47;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 36px rgba(232,255,71,0.3), 0 0 72px rgba(232,255,71,0.1);
    }
    /* Anillos de pulso: generados por JS en #radar-ripple (z-index:0), pasan por detrás de todo */
    .onb-pulse-overlay-ring {
      position: absolute;
      width: 80px; height: 80px;
      margin-left: -40px; margin-top: -40px;
      border-radius: 50%;
      border: 0.5px solid rgba(232,255,71,0.35);
      animation: onb-pulse-expand 5s ease-out infinite;
      pointer-events: none;
    }
    @keyframes onb-pulse-expand {
      0%   { transform: scale(1);  opacity: 0.7; }
      8%   { opacity: 0.5; }
      100% { transform: scale(25); opacity: 0; }
    }
    /* Líneas de conexión entre pares de puntos */
    .login-connect-line {
      position: absolute;
      height: 1px;
      transform-origin: left center;
      background: linear-gradient(to right, transparent, rgba(232,255,71,0.25), transparent);
      opacity: 0;
      pointer-events: none;
      animation: login-line-show 5s ease-in-out infinite;
    }
    @keyframes login-line-show {
      0%, 15%  { opacity: 0; }
      30%, 60% { opacity: 1; }
      85%, 100%{ opacity: 0; }
    }
    .onb-brand {
      font-weight: 900; font-size: 16px;
      color: #0c0c0c; line-height: 1; user-select: none;
    }
    .onb-d { font-style: italic; }

    /* Dots: personas cercanas animadas */
    .onb-dot {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e8ff47;
      z-index: 4;
      opacity: 0;
      animation: onb-dot-appear 3s ease-out infinite;
    }
    .onb-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid rgba(232,255,71,0.4);
      animation: onb-dot-ring 3s ease-out infinite;
    }
    @keyframes onb-dot-appear {
      0%, 20%  { opacity: 0; transform: scale(0.5); }
      30%, 70% { opacity: 1; transform: scale(1); }
      90%, 100% { opacity: 0; }
    }
    @keyframes onb-dot-ring {
      0%, 20%  { transform: scale(0.5); opacity: 0; }
      30%      { transform: scale(1); opacity: 0.6; }
      90%      { transform: scale(2.5); opacity: 0; }
    }

    /* Contenido inferior — gradiente para que las ondas pasen por detrás */
    .onb-bottom {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 28px 40px;
      position: relative; z-index: 2;
      background: linear-gradient(to bottom, transparent 0%, #0c0c0c 22%);
    }
    /* [botones] contenedor con ancho controlado */
    .onb-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 260px;
    }
    .onb-bottom .btn-login {
      width: 100%;
      padding: 16px 24px;
      font-size: 14px;
    }
    .onb-wordmark {
      font-weight: 900;
      font-size: 72px;
      color: #e8ff47;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 16px;
    }
    .onb-wordmark-d { font-style: italic; }
    .onb-headline {
      font-weight: 900;
      font-size: 32px;
      color: #f5f0e8;
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    .onb-headline em { color: #e8ff47; font-style: normal; }
    .onb-sub {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    @media (min-width: 768px) {
      .onb-wordmark { font-size: 88px; }
      .onb-headline { font-size: 38px; }
      .onb-bottom   { padding: 0 40px 48px; }
      .or4 { width: 440px; height: 440px; }
      .or5 { width: 580px; height: 580px; }
    }

    @media (min-width: 1024px) {
      /* login ocupa toda la cuadrícula */
      .login-screen {
        grid-column: 1 / -1 !important;
        grid-row: 1 / -1 !important;
        flex-direction: row;
        padding: 0 !important;
        align-items: stretch;
      }
      .onb-radar {
        flex: 1;
        height: 100vh;
      }
      .or4 { width: 560px; height: 560px; }
      .or5 { width: 720px; height: 720px; }
      .onb-bottom {
        width: 420px;
        flex-shrink: 0;
        padding: 0 56px;
        justify-content: center;
        border-left: 1px solid #1a1a1a;
        background: #0c0c0c;
        position: relative; z-index: 2;
      }
      .onb-wordmark { font-size: 80px; }
      .onb-headline { font-size: 32px; }
    }

    /* ═══════════════════════════════════════════
       [6] Ecualizador animado
    ═══════════════════════════════════════════ */
    .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      flex-shrink: 0;
    }
    .eq-bar {
      width: 3px;
      border-radius: 2px;
      transform-origin: bottom;
      animation: eq-dance 0.75s ease-in-out infinite;
    }
    .eq-bar:nth-child(1) { animation-delay: 0s; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    @keyframes eq-dance {
      0%, 100% { height: 4px; }
      50%       { height: 14px; }
    }
    /* Versión oscura para usar sobre fondos claros (bottom-bar amarilla) */
    .eq-dark .eq-bar  { background: rgba(0,0,0,0.5); }
    /* Versión clara para usar sobre fondos oscuros (topbar) */
    .eq-light .eq-bar { background: #e8ff47; opacity: 0.6; }

    @media (prefers-reduced-motion: reduce) {
      .eq-bar, .radar-ring, .pulse-ring, .inbox-ring, .login-ring, .lr1, .lr2, .lr3 {
        animation: none;
      }
    }

    /* ═══════════════════════════════════════════
       LISTEN SCREEN (entrada sin login)
    ═══════════════════════════════════════════ */
    .listen-screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 28px; overflow-y: auto;
    }
    .listen-brand {
      font-size: 52px; font-weight: 900; letter-spacing: -2px;
      color: #f5f0e8; line-height: 1; margin-bottom: 4px;
    }
    .listen-brand em { font-style: italic; color: #e8ff47; }
    .listen-tagline {
      font-size: 11px; color: #555; letter-spacing: 3px; text-transform: uppercase;
      margin-bottom: 44px;
    }
    .listen-sub {
      font-size: 12px; color: #444; text-align: center; line-height: 1.6;
      max-width: 280px; margin-bottom: 32px;
    }
    .listen-sub em { color: #666; font-style: normal; }
    .listen-connect-btns { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }

    @media (min-width: 1024px) {
      .listen-screen { grid-column: 1 / -1 !important; grid-row: 1 / -1 !important; }
    }
  </style>
</head>
<body>
<div id="radar-ripple"></div>
<div id="app"></div>
<div class="toast" id="toast"><span class="toast-text" id="toast-text"></span></div>

<script>
'use strict';

const SERVER = 'https://radar-mvp.onrender.com';

const S = {
  screen: 'listen',
  userId: null,
  spotifyToken: null,
  lastfmUsername: null,
  feed: [],
  notifications: [],
  chats: [],
  activeChatId: null,
  chatOrigin: 'inbox',
  chatCountdown: '60:00',
  messages: [],
  mySong: null,
  myArtist: null,
  coords: null,
  sideTab: 'inbox',
};

const feedMap = new Map();
const chatMap = new Map();

let pollInterval    = null;
let songInterval    = null;
let chatPollInt     = null;
let countdownInt    = null;
let toastTimer      = null;
let feedClickHandler = null;

// ── Persist ──
const SPOTIFY_TOKEN_TTL = 3500 * 1000; // 3500s (~58min) — expire slightly early

function saveAuth() {
  try {
    localStorage.setItem('radar_auth', JSON.stringify({
      userId: S.userId,
      spotifyToken: S.spotifyToken,
      spotifyTokenAt: S.spotifyToken ? Date.now() : null,
      lastfmUsername: S.lastfmUsername,
    }));
  } catch(e) {}
}
function loadAuth() {
  try {
    const raw = localStorage.getItem('radar_auth');
    if (!raw) return;
    const { userId, spotifyToken, spotifyTokenAt, lastfmUsername } = JSON.parse(raw);
    // No timestamp = token saved before tracking was added → treat as expired
    const noTimestamp = spotifyToken && !spotifyTokenAt;
    const tooOld      = spotifyToken && spotifyTokenAt && (Date.now() - spotifyTokenAt > SPOTIFY_TOKEN_TTL);
    const badToken    = noTimestamp || tooOld;
    S.userId         = userId || null;
    S.spotifyToken   = badToken ? null : (spotifyToken || null);
    S.lastfmUsername = lastfmUsername || null;
    if (badToken && !S.lastfmUsername) {
      // Keep userId — user stays on feed with reconnect prompt, token just needs renewal
      showToast(T.tokenExpired);
    }
  } catch(e) {}
}

// ── i18n ──
const isES = (navigator.language || '').toLowerCase().startsWith('es');
const T = {
  youListen:    isES ? 'ESCUCHAS.'        : 'YOU LISTEN.',
  theyListen:   isES ? 'TE ESCUCHAN.'     : 'THEY LISTEN.',
  nowPlaying:   isES ? 'ESCUCHANDO AHORA' : 'NOW PLAYING',
  signalSent:   isES ? 'Señal enviada'    : 'Signal sent',
  back:         isES ? '← VOLVER'         : '← BACK',
  messages:     isES ? 'MENSAJES'         : 'MESSAGES',
  signals:      isES ? 'SEÑALES'          : 'SIGNALS',
  sigRec:       isES ? 'SEÑALES RECIBIDAS': 'SIGNALS RECEIVED',
  ignore:       isES ? 'IGNORAR'          : 'IGNORE',
  wasListening: isES ? 'ESCUCHABA'        : 'WAS LISTENING TO',
  connect:      isES ? 'CONECTAR'         : 'CONNECT',
  activeChat:   isES ? 'CHAT ACTIVO'      : 'ACTIVE CHAT',
  expiresIn:    isES ? 'expira en'        : 'expires in',
  min:          isES ? 'min'              : 'min',
  noMessages:   isES ? 'Sin mensajes ni señales, aún.' : 'No messages or signals yet.',
  nobody:       isES ? 'Nadie está escuchando música a tu alrededor...' : "Nobody is listening to music around you...",
  anonChat:     isES ? 'chat anónimo'     : 'anonymous chat',
  safetyWarn:   isES ? 'No compartas información personal — números, redes, apellidos.' : 'Do not share personal info — numbers, handles, last names.',
  typeHere:     isES ? 'Escribe...'       : 'Type...',
  nothing:      isES ? 'Nada sonando'     : 'Nothing playing',
  putMusic:     isES ? 'Ponle música →'   : 'Put some music on →',
  reconnect:    isES ? 'Reconectar Spotify' : 'Reconnect Spotify',
  tokenExpired: isES ? 'Sesión de Spotify expirada. Reconecta para seguir compartiendo.' : 'Spotify session expired. Reconnect to keep sharing.',
  activeChats:  isES ? 'CHATS ACTIVOS'    : 'ACTIVE CHATS',
  delConfirm:   isES ? '¿Eliminar esta conversación?' : 'Delete this conversation?',
  loading:      isES ? 'CARGANDO...'      : 'LOADING...',
  chats:        isES ? 'CHATS'            : 'CHATS',
  noChat:       isES ? 'Sin chat activo.' : 'No active chat.',
  tagline:      isES ? 'música que conecta' : 'music that connects',
  connectSpot:  isES ? 'Continuar con Spotify' : 'Continue with Spotify',
  connectLfm:   isES ? 'Continuar con Last.fm' : 'Continue with Last.fm',
  listenSub:    isES ? 'Conecta tu cuenta para compartir lo que escuchas con personas cerca tuyo.'
                     : 'Connect your account to share what you listen to with people nearby.',
  lfmNote:      isES ? 'Last.fm sincroniza con Apple Music, YouTube Music y más'
                     : 'Last.fm syncs with Apple Music, YouTube Music and more',
};

// ── Utils ──
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isDesktop() { return window.matchMedia('(min-width: 1024px)').matches; }

async function apiFetch(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(SERVER + path, opts);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function showToast(msg) {
  const el = document.getElementById('toast'), txt = document.getElementById('toast-text');
  if (!el || !txt) return;
  txt.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function showLoading(show) {
  const ex = document.getElementById('loading-overlay');
  if (show && !ex) {
    const el = document.createElement('div');
    el.id = 'loading-overlay'; el.className = 'loading-overlay';
    el.innerHTML = `<span class="loading-text">${T.loading}</span>`;
    document.body.appendChild(el);
  } else if (!show && ex) { ex.remove(); }
}

// ── Location ──
function getLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => { S.coords = { lat: p.coords.latitude, lng: p.coords.longitude }; },
    () => { S.coords = S.coords || { lat: 40.4168, lng: -3.7038 }; },
    { timeout: 10000, maximumAge: 60000 }
  );
}

// ── Polling ──
function startPolling(uid, token, lfUser) {
  stopPolling();
  const lf = lfUser || S.lastfmUsername;
  songInterval = setInterval(() => updateLocation(uid, token, lf), 5000);
  updateLocation(uid, token, lf);
  pollInterval = setInterval(() => refreshAll(uid), 15000);
  refreshAll(uid);
}
function stopPolling() {
  clearInterval(pollInterval); clearInterval(songInterval);
  pollInterval = null; songInterval = null;
}

async function fetchSpotifyCurrentTrack(token) {
  try {
    // /me/player includes paused state (covers iOS where OAuth pauses playback briefly)
    const res = await fetch('https://api.spotify.com/v1/me/player', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 200) {
      const data = await res.json();
      if (data?.item) return { song: data.item.name, artist: data.item.artists?.[0]?.name || '' };
    }
    // Fallback: currently-playing
    if (res.status === 204 || res.status === 200) {
      const res2 = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res2.status === 200) {
        const data2 = await res2.json();
        if (data2?.item) return { song: data2.item.name, artist: data2.item.artists?.[0]?.name || '' };
      }
    }
  } catch(e) {}
  return null;
}

async function updateLocation(uid, token, lf) {
  if (!uid || (!token && !lf)) return;
  const c = S.coords || { lat: 40.4168, lng: -3.7038 };

  // Lee directamente de Spotify desde el browser (CORS permitido)
  if (token) {
    const track = await fetchSpotifyCurrentTrack(token);
    if (track) {
      S.mySong = track.song; S.myArtist = track.artist;
      S._nullSongCount = 0;
      patchNowPlaying();
    }
  }

  try {
    const res = await apiFetch('POST', '/update-location', {
      userId: uid, lat: c.lat, lng: c.lng,
      token: token || null, lastfmUsername: lf || null,
      // Enviamos también la canción para que el backend la almacene si lo soporta
      song: S.mySong || null, artist: S.myArtist || null,
    });
    // Si el backend devuelve algo, úsalo (Last.fm path)
    if (res.song && !token) { S.mySong = res.song; S.myArtist = res.artist || null; S._nullSongCount = 0; patchNowPlaying(); }
    else if (!res.song && !token) { S._nullSongCount = (S._nullSongCount || 0) + 1; patchBottomBar(); }
  } catch(e) {
    if (!token) { S._nullSongCount = (S._nullSongCount || 0) + 1; patchBottomBar(); }
  }
}

async function refreshAll(uid) {
  if (!uid) return;
  const c = S.coords || { lat: 40.4168, lng: -3.7038 };
  try {
    const [feedRes, notifRes, chatsRes] = await Promise.all([
      fetch(`${SERVER}/nearby?lat=${c.lat}&lng=${c.lng}&userId=${uid}`).then(r => r.json()),
      fetch(`${SERVER}/notifications?userId=${uid}`).then(r => r.json()),
      fetch(`${SERVER}/my-chats?userId=${uid}`).then(r => r.json()),
    ]);
    S.feed          = feedRes.nearby || [];
    S.notifications = notifRes.notifications || notifRes.taps || [];
    // Filter out expired chats client-side (server may still return them briefly)
    S.chats         = (chatsRes.chats || []).filter(c => !c.expiresAt || new Date(c.expiresAt) > Date.now());
    feedMap.clear(); S.feed.forEach(i => feedMap.set(i.userId, i));
    chatMap.clear(); S.chats.forEach(c => chatMap.set(c.otherUserId, c));

    if (isDesktop()) { patchDesktopFeed(); patchDesktopSide(); patchTopbarInbox(); }
    else {
      if (S.screen === 'feed')  { patchFeedList(); patchInboxDot(); }
      if (S.screen === 'inbox') renderInbox();
    }
  } catch(e) {}
}

// ── Auth ──
function loginWithSpotify() {
  const redirect = window.location.origin + window.location.pathname;
  window.location.href = `${SERVER}/login?redirect=${encodeURIComponent(redirect)}`;
}
function loginWithLastfm() {
  const redirect = window.location.origin + window.location.pathname;
  window.location.href = `${SERVER}/lastfm/login?redirect=${encodeURIComponent(redirect)}`;
}

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  window.history.replaceState({}, '', window.location.pathname);

  // New flow: backend exchanges code server-side, passes token directly in URL
  const accessToken = params.get('access_token');
  const userId      = params.get('user_id');
  const authError   = params.get('auth_error');
  const lfToken     = params.get('lastfm_token');
  // Legacy: backend passed raw code (kept as fallback for old redirects)
  const code        = params.get('code');

  if (accessToken && userId) {
    S.spotifyToken = accessToken; S.userId = userId; saveAuth();
    afterLogin();
    return;
  }

  if (authError) {
    setScreen('listen');
    const isDevMode = authError === 'access_denied';
    const msg = isDevMode
      ? (isES ? 'Tu cuenta Spotify no está autorizada en esta app. Contacta al desarrollador.' : 'Your Spotify account is not authorized for this app. Contact the developer.')
      : (isES ? `Error al conectar con Spotify (${authError}). Intenta de nuevo.` : `Spotify connection error (${authError}). Try again.`);
    showToast(msg);
    return;
  }

  if (code) {
    // Fallback for cached redirects that still carry a raw code
    showLoading(true);
    try {
      const res = await apiFetch('POST', '/exchange-token', { code });
      if (!res.access_token || !res.userId) throw new Error('invalid');
      S.spotifyToken = res.access_token; S.userId = res.userId; saveAuth();
      showLoading(false); afterLogin();
    } catch(e) {
      showLoading(false); setScreen('listen');
      showToast(isES ? 'Error al conectar con Spotify. Intenta de nuevo.' : 'Spotify connection failed. Please try again.');
    }
    return;
  }

  if (lfToken) {
    showLoading(true);
    try {
      const res = await apiFetch('POST', '/lastfm/session', { token: lfToken });
      S.lastfmUsername = res.username; S.userId = res.username; saveAuth();
      showLoading(false); afterLogin();
    } catch(e) {
      showLoading(false); setScreen('listen');
      showToast(isES ? 'Error al conectar con Last.fm. Intenta de nuevo.' : 'Last.fm connection failed. Please try again.');
    }
    return;
  }
}

function afterLogin() {
  getLocation();
  setScreen('feed');
  startPolling(S.userId, S.spotifyToken, S.lastfmUsername);
}

// ── Tap / Chat ──
const tapsInFlight = new Set();

async function sendTap(userId) {
  if (tapsInFlight.has(userId)) return;
  const item = feedMap.get(userId);
  if (!item) return;
  tapsInFlight.add(userId);
  try {
    const res = await apiFetch('POST', '/tap', {
      fromUserId: S.userId,
      toUserId: item.userId,
      song: item.song,
      artist: item.artist,
      fromSong: S.mySong || null,
      fromArtist: S.myArtist || null,
    });
    if (res.alreadyChat && res.chatId) { openChat(res.chatId, 'feed', res.expiresAt || null); }
    else { showToast(`${T.signalSent} · ${item.song}`); }
  } catch(e) {}
  finally { tapsInFlight.delete(userId); }
}

async function respondTap(tapId, accept) {
  S.notifications = S.notifications.filter(n => n.tapId !== tapId);
  try {
    const res = await apiFetch('POST', '/respond-tap', { tapId, accept, userId: S.userId });
    if (accept && res.chatId) { openChat(res.chatId, 'inbox', res.expiresAt); }
    else { if (isDesktop()) patchDesktopSide(); else renderInbox(); }
  } catch(e) { if (isDesktop()) patchDesktopSide(); else renderInbox(); }
}

function openChat(chatId, origin, expiresAt) {
  S.activeChatId = chatId; S.chatOrigin = origin; S.messages = [];
  const mins = expiresAt ? Math.max(0, Math.round((new Date(expiresAt) - Date.now()) / 60000)) : 60;
  startCountdown(mins); loadMessages(chatId); startChatPolling(chatId);
  if (isDesktop()) { S.sideTab = 'chat'; patchDesktopSide(); }
  else { setScreen('chat'); }
}

async function loadMessages(chatId) {
  try {
    const res = await apiFetch('GET', `/messages?chatId=${chatId}&t=${Date.now()}`);
    S.messages = res.messages || [];
    patchMessages();
  } catch(e) {}
}

function startChatPolling(chatId) {
  clearInterval(chatPollInt);
  chatPollInt = setInterval(() => loadMessages(chatId), 5000);
}
function stopChatPolling() { clearInterval(chatPollInt); chatPollInt = null; }

function startCountdown(minutes = 60) {
  clearInterval(countdownInt);
  let secs = minutes * 60;
  // Actualizar de inmediato para que el chat se renderice con el tiempo correcto
  const m0 = Math.floor(secs/60), s0 = String(secs%60).padStart(2,'0');
  S.chatCountdown = secs > 0 ? `${m0}:${s0}` : '0:00';
  countdownInt = setInterval(() => {
    secs--;
    if (secs <= 0) { clearInterval(countdownInt); S.chatCountdown = '0:00'; }
    else { const m = Math.floor(secs/60), s = String(secs%60).padStart(2,'0'); S.chatCountdown = `${m}:${s}`; }
    const el = document.getElementById('chat-timer');
    if (el) el.textContent = `${T.anonChat} · ${S.chatCountdown}`;
  }, 1000);
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.focus();
  S.messages.push({ id: Date.now().toString(), text, userId: S.userId });
  patchMessages();
  if (S.activeChatId) {
    try { await apiFetch('POST', '/message', { chatId: S.activeChatId, userId: S.userId, text }); } catch(e) {}
  }
}

async function deleteChat(chatId) {
  if (!confirm(T.delConfirm)) return;
  try { await apiFetch('DELETE', `/chat/${chatId}`, { userId: S.userId }); } catch(e) {}
  S.chats = S.chats.filter(c => c.chatId !== chatId);
  chatMap.clear(); S.chats.forEach(c => chatMap.set(c.otherUserId, c));
  if (S.activeChatId === chatId) { S.activeChatId = null; S.sideTab = 'inbox'; }
  if (isDesktop()) patchDesktopSide(); else renderInbox();
}

function exitChat() {
  stopChatPolling(); clearInterval(countdownInt);
  if (isDesktop()) { S.sideTab = 'inbox'; patchDesktopSide(); }
  else { setScreen(S.chatOrigin || 'inbox'); refreshAll(S.userId); }
}

// ── Screen ──
function setScreen(screen) {
  S.screen = screen; render();
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (S.screen !== 'feed') stopRippleLoop();
  const authScreens = ['login', 'listen'];
  if (isDesktop() && !authScreens.includes(S.screen)) { renderDesktop(app); return; }
  switch (S.screen) {
    case 'listen': renderListen(app); break;
    case 'login':  renderLogin(app);  break;
    case 'feed':   renderFeed(app);   break;
    case 'inbox':  renderInbox(app);  break;
    case 'chat':   renderChat(app);   break;
  }
  if (!isDesktop()) attachSwipe(app);
}

function buildDesktopSide() {
  const notifCount = S.notifications.length;
  const chatCount  = S.chats.length;

  const inboxLabel = notifCount + chatCount > 0
    ? `${T.messages} <span style="color:#e8ff47;font-size:10px;">${notifCount + chatCount}</span>`
    : T.messages;

  return `
    <div class="side-tabs">
      <button class="side-tab ${S.sideTab === 'inbox' ? 'active' : ''}" id="tab-inbox">${inboxLabel}</button>
      <button class="side-tab ${S.sideTab === 'chat'  ? 'active' : ''}" id="tab-chat">${T.chats}${S.activeChatId ? ' <span style="color:#e8ff47;font-size:10px;">●</span>' : ''}</button>
    </div>
    <div class="side-tab-content" id="side-content">
      ${S.sideTab === 'inbox' ? buildInboxContent() : buildChatContent()}
    </div>`;
}

function buildInboxContent() {
  const signals = S.notifications.map(item => `
    <div class="card" data-tap-id="${esc(item.tapId)}">
      <div class="card-info">
        <div class="signal-label">${T.wasListening}</div>
        <div class="song-name">${esc(item.fromSong || item.song)}</div>
        <div class="artist-name">${esc(item.fromArtist || item.artist)}</div>
      </div>
      <button class="btn-connect" data-action="connect" data-tap="${esc(item.tapId)}">${T.connect}</button>
      <button class="btn-ignore"  data-action="ignore"  data-tap="${esc(item.tapId)}">${T.ignore}</button>
    </div>`).join('');

  const chatItems = S.chats.map(item => `
    <div class="card has-chat" data-chat-id="${esc(item.chatId)}" data-chat-expires="${esc(item.expiresAt||'')}">
      <div class="card-info">
        <div class="signal-label">${T.activeChat}</div>
        <div class="song-name">${esc(item.song)}</div>
        <div class="artist-name">${esc(item.artist)}</div>
        <div class="distance">${T.expiresIn} ${esc(String(item.minutesLeft))} ${T.min}</div>
      </div>
      <button class="btn-close-chat" data-action="close-chat" data-chat-id="${esc(item.chatId)}">✕</button>
    </div>`).join('');

  const empty = !S.notifications.length && !S.chats.length
    ? `<span class="empty">${T.noMessages}</span>` : '';

  return `
    ${S.notifications.length ? `<div class="section-label" style="margin-bottom:12px;">${T.sigRec}</div>` : ''}
    ${signals}
    ${S.chats.length ? `<div class="section-label" style="margin-top:16px;margin-bottom:12px;">${T.activeChats}</div>` : ''}
    ${chatItems}
    ${empty}`;
}

function buildChatContent() {
  if (!S.activeChatId) return `<span class="empty">${T.noChat}</span>`;
  return `
    <div style="display:flex;flex-direction:column;height:100%;gap:0;">
      <div class="chat-anon" id="chat-timer" style="text-align:left;padding:0 0 4px;margin-bottom:2px;">${T.anonChat} · ${S.chatCountdown}</div>
      <div class="chat-warning" style="text-align:left;padding:0 0 8px;border-bottom:1px solid #1a1a1a;margin-bottom:8px;">${T.safetyWarn}</div>
      <div class="messages-area" id="messages-area" style="flex:1;padding:8px 0;">
        ${buildMessages()}
      </div>
      <div class="input-row" style="padding:10px 0 0;border-top:1px solid #1e1e1e;gap:8px;">
        <input id="chat-input" class="chat-input" placeholder="${T.typeHere}" autocomplete="off">
        <button class="send-btn" id="send-btn">→</button>
      </div>
    </div>`;
}

function buildMessages() {
  return S.messages.map(m => `
    <div class="bubble ${m.userId === S.userId ? 'bubble-me' : 'bubble-them'}">
      <span class="bubble-text">${esc(m.text)}</span>
    </div>`).join('');
}

function attachSideEvents() {
  const tabInbox = document.getElementById('tab-inbox');
  const tabChat  = document.getElementById('tab-chat');
  if (tabInbox) tabInbox.onclick = () => { S.sideTab = 'inbox'; patchDesktopSide(); };
  if (tabChat)  tabChat.onclick  = () => { S.sideTab = 'chat';  patchDesktopSide(); };

  const content = document.getElementById('side-content');
  if (!content) return;

  content.addEventListener('click', e => {
    const conn  = e.target.closest('[data-action="connect"]');
    const ign   = e.target.closest('[data-action="ignore"]');
    const close = e.target.closest('[data-action="close-chat"]');
    const card  = e.target.closest('.card.has-chat');
    if (conn)  { respondTap(conn.dataset.tap, true);  return; }
    if (ign)   { respondTap(ign.dataset.tap,  false); return; }
    if (close) { e.stopPropagation(); deleteChat(close.dataset.chatId); return; }
    if (card && card.dataset.chatId) openChat(card.dataset.chatId, 'inbox', card.dataset.chatExpires || null);
  });

  const sendBtn = document.getElementById('send-btn');
  if (sendBtn) sendBtn.onclick = sendMessage;
  const chatInput = document.getElementById('chat-input');
  if (chatInput) chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

  scrollToBottom();
}

  const btn = document.getElementById('topbar-inbox');

  const notifCount  = S.notifications.length;

  btn.innerHTML = `${hasActivity ? '<div class="topbar-inbox-ring"></div>' : ''}<div class="topbar-inbox-dot ${hasActivity ? 'has-activity' : ''}">${notifCount > 0 ? notifCount : '◉'}</div>`;

function patchNowPlaying() {

    <div class="bottom-artist">${esc(S.myArtist || '')}</div>`;
  if (!S.spotifyToken && !S.lastfmUsername) {
    return `<div class="bottom-song-title" style="font-size:12px;opacity:0.7;">${T.reconnect}</div><div class="bottom-artist">${isES ? 'Toca para reconectar' : 'Tap to reconnect'}</div>`;
  }
  if ((S._nullSongCount || 0) >= 3) {
    return `<div class="bottom-song-title" style="font-size:12px;opacity:0.7;">${T.reconnect}</div><div class="bottom-artist">${isES ? 'Toca para reconectar' : 'Tap to reconnect'}</div>`;
  }
  return `<div class="bottom-song-title">${T.nothing}</div><div class="bottom-artist">${T.putMusic}</div>`;
}

function attachFeedEvents() {
  const list = document.getElementById('feed-list');
  if (!list) return;
  if (feedClickHandler) list.removeEventListener('click', feedClickHandler);
  feedClickHandler = e => {
    const listenBtn = e.target.closest('[data-action="listen"]');
    const chatBtn   = e.target.closest('[data-action="chat"]');
    const card      = e.target.closest('.card.has-chat');
    if (listenBtn) { e.stopPropagation(); window.open(`https://open.spotify.com/search/${listenBtn.dataset.query}`, '_blank'); }
    else if (chatBtn) { e.stopPropagation(); sendTap(chatBtn.dataset.userid); }
    else if (card) { const ec = chatMap.get(card.dataset.userid); if (ec) openChat(ec.chatId, 'feed', ec.expiresAt); }
  };
  list.addEventListener('click', feedClickHandler);
}

function patchFeedList() {
  const list = document.getElementById('feed-list');
  if (!list) return;
  feedMap.clear(); S.feed.forEach(i => feedMap.set(i.userId, i));
  chatMap.clear(); S.chats.forEach(c => chatMap.set(c.otherUserId, c));
  list.innerHTML = buildFeedItems();
  attachFeedEvents();
}

function patchBottomBar() {
  const btn = document.getElementById('bottom-song-btn');
  if (!btn) return;
  btn.innerHTML = buildBottomSong();
}

function patchInboxDot() {
  const btn = document.getElementById('inbox-btn');
  if (!btn) return;
  const hasActivity = S.notifications.length > 0 || S.chats.length > 0;
  btn.innerHTML = `${hasActivity ? '<div class="inbox-ring"></div>' : ''}<div class="inbox-dot ${hasActivity ? 'has-activity' : ''}">${S.notifications.length > 0 ? S.notifications.length : '◉'}</div>`;
}

function patchMessages() {
  const area = document.getElementById('messages-area');
  if (!area) return;
  area.innerHTML = buildMessages();
  scrollToBottom();
}

function scrollToBottom() {
  const area = document.getElementById('messages-area');
  if (area) requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
}

// ── Puntos de conexión + pulso login (todo en #radar-ripple, z-index:0) ──
function triggerLoginDots() {
  const overlay = document.getElementById('radar-ripple');
  if (!overlay) return;
  overlay.innerHTML = '';

  // Anillos de pulso: medir el centro tras un frame de render
  const borders = ['rgba(232,255,71,0.35)', 'rgba(232,255,71,0.2)', 'rgba(232,255,71,0.12)'];
  const delays3 = [0, 1.6, 3.2];
  requestAnimationFrame(() => {
    const center = document.querySelector('.onb-center');
    let cx = window.innerWidth / 2, cy = window.innerHeight * 0.34;
    if (center) {
      const r = center.getBoundingClientRect();
      if (r.width > 0) { cx = r.left + r.width/2; cy = r.top + r.height/2; }
    }
    delays3.forEach((d, i) => {
      const ring = document.createElement('div');
      ring.className = 'onb-pulse-overlay-ring';
      ring.style.cssText = `left:${cx}px;top:${cy}px;animation-delay:${d}s;border-color:${borders[i]};`;
      overlay.appendChild(ring);
    });
  });

  // Puntos dispersos: algunos conectan, la mayoría no
  // Posiciones en % para que funcionen sin depender de window.innerWidth/Height
  const W = window.innerWidth  || document.documentElement.clientWidth  || 375;
  const H = window.innerHeight || document.documentElement.clientHeight || 812;

  // Solos — aparecen y desaparecen sin conectar con nadie
  const solos = [
    { l: '8%',  t:  '9%', delay: 0.0 },
    { l: '72%', t:  '7%', delay: 3.2 },
    { l: '91%', t: '38%', delay: 1.1 },
    { l: '4%',  t: '55%', delay: 4.0 },
    { l: '55%', t: '75%', delay: 2.3 },
    { l: '40%', t: '20%', delay: 0.6 },
  ];
  solos.forEach(({ l, t, delay }) => {
    const d = document.createElement('div');
    d.className = 'login-dot';
    d.style.cssText = `left:${l};top:${t};animation-delay:${delay}s;`;
    overlay.appendChild(d);
  });

  // Pares — dos puntos que se encuentran y conectan
  const pairs = [
    { al: '18%', at: '6%',  bl: '28%', bt: '13%', delay: 1.8 },
    { al: '78%', at: '28%', bl: '88%', bt: '20%', delay: 3.5 },
    { al: '12%', at: '48%', bl: '22%', bt: '56%', delay: 0.8 },
    { al: '62%', at: '65%', bl: '74%', bt: '73%', delay: 2.6 },
  ];
  pairs.forEach(({ al, at, bl, bt, delay }) => {
    const ax = parseFloat(al)/100*W, ay = parseFloat(at)/100*H;
    const bx = parseFloat(bl)/100*W, by = parseFloat(bt)/100*H;
    const dist  = Math.sqrt((bx-ax)**2 + (by-ay)**2);
    const angle = Math.atan2(by-ay, bx-ax) * 180 / Math.PI;

    const dA = document.createElement('div');
    dA.className = 'login-dot';
    dA.style.cssText = `left:${al};top:${at};animation-delay:${delay}s;`;
    overlay.appendChild(dA);

    const dB = document.createElement('div');
    dB.className = 'login-dot';
    dB.style.cssText = `left:${bl};top:${bt};animation-delay:${delay+0.2}s;`;
    overlay.appendChild(dB);

    const line = document.createElement('div');
    line.className = 'login-connect-line';
    line.style.cssText = `left:${al};top:${at};width:${dist}px;transform:rotate(${angle}deg);animation-delay:${delay+0.5}s;`;
    overlay.appendChild(line);
  });
}

// ── Ripple de ondas expansivo (una sola pasada, cubre todo el viewport) ──
function triggerRipple(fromEl) {
  const overlay = document.getElementById('radar-ripple');
  if (!overlay) return;
  let cx, cy;
  if (fromEl) {
    const r = fromEl.getBoundingClientRect();
    cx = r.left + r.width  / 2;
    cy = r.top  + r.height / 2;
  } else {
    cx = window.innerWidth  / 2;
    cy = window.innerHeight / 2;
  }
  const size = 50;
  overlay.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const ring = document.createElement('div');
    ring.className = 'ripple-ring';
    ring.style.cssText = `width:${size}px;height:${size}px;left:${cx - size/2}px;top:${cy - size/2}px;animation-delay:${i * 0.4}s;`;
    overlay.appendChild(ring);
  }
}

// ── Onda cada 10s en las pantallas interiores ──
let rippleInterval = null;
function startRippleLoop() {
  stopRippleLoop();
  rippleInterval = setInterval(() => {
    const btn = document.getElementById('radar-btn') || document.getElementById('topbar-radar');
    if (btn) triggerRipple(btn);
  }, 10000);
}
function stopRippleLoop() {
  clearInterval(rippleInterval);
  rippleInterval = null;
}

async function doRadar() {
  const btn = document.getElementById('radar-btn') || document.getElementById('topbar-radar');
  if (btn) {
    btn.style.opacity = '0.5';
    setTimeout(() => { if (btn) btn.style.opacity = ''; }, 300);
    triggerRipple(btn);
  }
  await refreshAll(S.userId);
}

// ── Swipe (mobile) ──
let swipeSX = 0, swipeSY = 0;
function attachSwipe(el) {
  el.addEventListener('touchstart', e => { swipeSX = e.touches[0].clientX; swipeSY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - swipeSX;
    const dy = e.changedTouches[0].clientY - swipeSY;
    if (Math.abs(dx) < 50 || Math.abs(dy) > 80) return;
    if (S.screen === 'feed'  && dx < 0) { setScreen('inbox'); return; }
    if (S.screen === 'inbox' && dx > 0) { setScreen('feed');  return; }
    if (S.screen === 'chat'  && dx > 0) { exitChat(); return; }
  }, { passive: true });
}

// ── Resize ──
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (S.userId) render(); }, 150);
});

// ── Visual Viewport (keyboard awareness on iOS/iPadOS) ──
function setupVisualViewport() {
  const vv = window.visualViewport;
  if (!vv) return;

  const update = () => {
    const app = document.getElementById('app');
    if (!app) return;
    // Desktop: CSS grid handles layout — clear any stale inline styles
    if (isDesktop()) {
      app.style.cssText = '';
      return;
    }
    // Mobile/tablet: offset for virtual keyboard
    app.style.height   = vv.height + 'px';
    app.style.top      = vv.offsetTop  + 'px';
    app.style.left     = vv.offsetLeft + 'px';
    app.style.position = 'fixed';
    app.style.width    = vv.width + 'px';
    // maxWidth comes from CSS (480px mobile, 680px tablet) — don't override inline
    app.style.maxWidth = '';
    if (S.screen === 'chat' || S.sideTab === 'chat') scrollToBottom();
  };

  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  // Apply immediately so initial height is correct (not just on keyboard events)
  requestAnimationFrame(update);
}

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

// ── Init ──
async function init() {
  setupVisualViewport();
  loadAuth();
  const params = new URLSearchParams(window.location.search);
  if (params.get('code') || params.get('access_token') || params.get('auth_error') || params.get('lastfm_token')) {
    await handleCallback(); return;
  }
  if (S.userId) { getLocation(); setScreen('feed'); startPolling(S.userId, S.spotifyToken, S.lastfmUsername); }
  else { setScreen('listen'); }
}

init();
</script>
